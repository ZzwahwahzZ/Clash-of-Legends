name: Forensic C3 resource package audit
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-c3-resource-packages.yml"
      - "tools/gameplay_source_audit/audit_c3_resources.py"
permissions:
  contents: read
concurrency:
  group: c3-resource-forensics-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  c3-resource-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify exact mobile source archive
        run: |
          set -euo pipefail
          mkdir -p build/source reports
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/ZzwahwahzZ/Conquer-Mobile-Assets./releases/download/mobile-extracted-assets/extracted-assets-001.zip" \
            -o build/source/extracted-assets-001.zip
          echo "0d21a110c09b762ed5f1a5f4da022857b0534e489eb85052d15da460cb229d2a  build/source/extracted-assets-001.zip" | sha256sum -c -
      - name: Parse WDB and TPI/TPD packages and inspect original C3 chunks
        run: |
          python3 -m py_compile tools/gameplay_source_audit/audit_c3_resources.py
          python3 tools/gameplay_source_audit/audit_c3_resources.py \
            build/source/extracted-assets-001.zip \
            --output reports/c3-original-resource-forensics.json
          python3 -m json.tool reports/c3-original-resource-forensics.json > /dev/null
      - name: Print forensic summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("reports/c3-original-resource-forensics.json").read_text())
          print(json.dumps(d["summary"], ensure_ascii=False, indent=2))
          for apk in d["apk_packages"]:
              for p in apk["packages"]:
                  print(p["tpi_path"], "C3:", p["c3_entry_count"], "valid:", p["c3_valid_header_count"], "families:", p["c3_family_counts"])
          for w in d["wdb_packages"]:
              print("WDB entries:", w["valid_named_entries"], "DBC:", sum(1 for e in w["entries"] if e.get("dbc")))
          PY
      - name: Upload original C3 resource forensic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C3-Original-Resource-Forensics
          path: reports/c3-original-resource-forensics.json
          if-no-files-found: error
          retention-days: 30
