name: Phase 1 - Acquire and audit CC0 world assets
# Re-run the Godot visual audit at original world scale with full street and workshop groups.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase1-world-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: stage/phase1-world-assets
          fetch-depth: 0

      - name: Download pinned, license-verified production assets
        shell: bash
        run: |
          set -euo pipefail
          SAPPHIRE=3b1bdd7a3aa935126cbc39a1109f86661a789a5b
          NATURE=ea2f2aa1ca8da0898330c97df8a5489976b051d0
          mkdir -p assets/environment/phase1/sapphire assets/environment/phase1/kenney-nature reports
          raw_s="https://raw.githubusercontent.com/nameless525/sapphire/${SAPPHIRE}"
          raw_n="https://raw.githubusercontent.com/Hidencod/tge-assets/${NATURE}"
          curl --fail --location --retry 3 "${raw_s}/content/samples/environment/courtyard.glb" -o assets/environment/phase1/sapphire/courtyard.glb
          curl --fail --location --retry 3 "${raw_s}/content/samples/environment/ground.png" -o assets/environment/phase1/sapphire/ground.png
          curl --fail --location --retry 3 "${raw_s}/content/samples/environment/arcade.glb" -o assets/environment/phase1/sapphire/arcade.glb
          curl --fail --location --retry 3 "${raw_s}/content/lookdev/town/pieces/pavilion.glb" -o assets/environment/phase1/sapphire/pavilion.glb
          curl --fail --location --retry 3 "${raw_s}/LICENSE" -o assets/environment/phase1/sapphire/LICENSE-MIT.txt
          curl --fail --location --retry 3 "${raw_s}/content/third_party/vvaytoyek_chinese_pavilion/LICENSE.md" -o assets/environment/phase1/sapphire/PAVILION-LICENSE.md
          curl --fail --location --retry 3 "${raw_s}/content/third_party/vvaytoyek_chinese_pavilion/SOURCE.md" -o assets/environment/phase1/sapphire/PAVILION-SOURCE.md
          curl --fail --location --retry 3 "${raw_s}/content/third_party/README.md" -o assets/environment/phase1/sapphire/THIRD-PARTY-SOURCES.md
          curl --fail --location --retry 3 "${raw_n}/LICENSE" -o assets/environment/phase1/kenney-nature/LICENSE-CC0.txt
          for model in tree-oak tree-pinedefaulta rock-largea plant-bushdetailed; do
            curl --fail --location --retry 3 "${raw_n}/packs/nature-kit/${model}.glb" -o "assets/environment/phase1/kenney-nature/${model}.glb"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, struct
          root = Path("assets/environment/phase1")
          rows = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or 'jianghai' in path.parts:
                  continue
              data = path.read_bytes()
              row = {"path": path.as_posix(), "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}
              if path.suffix.lower() == ".glb":
                  if len(data) < 20 or data[:4] != b"glTF":
                      raise SystemExit(f"Invalid GLB header: {path}")
                  version, total_length = struct.unpack_from("<II", data, 4)
                  if version != 2 or total_length != len(data):
                      raise SystemExit(f"Invalid GLB version/length: {path}")
                  offset = 12
                  document = None
                  while offset + 8 <= len(data):
                      chunk_length, chunk_type = struct.unpack_from("<II", data, offset)
                      offset += 8
                      chunk = data[offset:offset + chunk_length]
                      offset += chunk_length
                      if chunk_type == 0x4E4F534A:
                          document = json.loads(chunk.decode("utf-8").rstrip("\x00 "))
                          break
                  if document is None:
                      raise SystemExit(f"GLB has no JSON chunk: {path}")
                  row["meshes"] = len(document.get("meshes", []))
                  row["nodes"] = len(document.get("nodes", []))
                  row["materials"] = len(document.get("materials", []))
                  row["images"] = len(document.get("images", []))
                  row["scenes"] = len(document.get("scenes", []))
              rows.append(row)
          models = [r for r in rows if r["path"].endswith(".glb")]
          if len(models) != 7:
              raise SystemExit(f"Expected 7 GLB assets, found {len(models)}")
          manifest = {
              "sapphire_source": "https://github.com/nameless525/sapphire",
              "sapphire_commit": "3b1bdd7a3aa935126cbc39a1109f86661a789a5b",
              "sapphire_project_license": "MIT; retained in sapphire/LICENSE-MIT.txt",
              "pavilion_original_source": "https://vvaytoyek.itch.io/chinese-four-corner-pavilion-free",
              "pavilion_original_license": "CC0-1.0; source/license evidence retained beside the derived GLB",
              "nature_source": "https://github.com/Hidencod/tge-assets",
              "nature_commit": "ea2f2aa1ca8da0898330c97df8a5489976b051d0",
              "nature_license": "CC0-1.0; retained in kenney-nature/LICENSE-CC0.txt",
              "asset_count": len(rows),
              "model_count": len(models),
              "files": rows
          }
          Path("reports/phase1_world_asset_manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print(f"PHASE1 ASSET INVENTORY: {len(rows)} files; {len(models)} GLB models")
          for row in models:
              print(json.dumps(row, ensure_ascii=False))
          PY
          cat > assets/environment/phase1/SOURCES.md <<'EOF'
          # Phase 1 production world asset sources

          ## Sapphire environment models
          - Source repository: https://github.com/nameless525/sapphire
          - Pinned source commit: 3b1bdd7a3aa935126cbc39a1109f86661a789a5b
          - courtyard.glb, arcade.glb, and ground.png are source-project environment assets; the repository MIT license is retained as LICENSE-MIT.txt.
          - pavilion.glb is a deterministic glTF conversion of VVayToyek's Chinese Four-corner Pavilion, originally CC0 1.0. The original source and license evidence are retained in PAVILION-SOURCE.md and PAVILION-LICENSE.md.

          ## Nature models
          - Source repository: https://github.com/Hidencod/tge-assets
          - Pinned source commit: ea2f2aa1ca8da0898330c97df8a5489976b051d0
          - Kenney Nature Kit models are CC0 1.0. The source repository's license is retained as LICENSE-CC0.txt.

          All downloaded models are pinned to immutable commits. SHA-256 hashes and GLB structural inventories are in reports/phase1_world_asset_manifest.json. These remain candidate assets until Godot import, visual review, scene integration, collision review, and Android runtime checks pass.
          EOF

      - name: Download and extract the licensed Chinese district
        shell: bash
        run: |
          set -euo pipefail
          CITY_COMMIT=d6a33b932e00fb9016dea407eca3f909aeaf2dcb
          CITY_RAW="https://raw.githubusercontent.com/AetherRadar/operation-steel-tide/${CITY_COMMIT}"
          mkdir -p /tmp/phase1-city-source assets/environment/phase1/jianghai reports
          curl --fail --location --retry 3 "${CITY_RAW}/assets/models/jianghai_old_city/jianghai_old_city.glb" -o /tmp/phase1-city-source/jianghai_old_city.glb
          echo "33e2176e52d538123d45abeea61464ea8e7002854a2b1d47e5c5d560ad32d17e  /tmp/phase1-city-source/jianghai_old_city.glb" | sha256sum -c -
          curl --fail --location --retry 3 "${CITY_RAW}/LICENSE" -o assets/environment/phase1/jianghai/LICENSE-MIT.txt
          curl --fail --location --retry 3 "${CITY_RAW}/source_art/world/jianghai_old_city/LICENSE_EVIDENCE.md" -o assets/environment/phase1/jianghai/LICENSE_EVIDENCE.md
          curl --fail --location --retry 3 "${CITY_RAW}/source_art/world/jianghai_old_city/README.md" -o assets/environment/phase1/jianghai/README.md
          curl --fail --location --retry 3 "${CITY_RAW}/assets/models/LICENSE.md" -o assets/environment/phase1/jianghai/THIRD_PARTY_LICENSES.md
          cat > assets/environment/phase1/jianghai/SOURCES.md <<'EOF'
          # Chinese district asset provenance

          - Source project: https://github.com/AetherRadar/operation-steel-tide
          - Pinned commit: d6a33b932e00fb9016dea407eca3f909aeaf2dcb
          - Source runtime GLB: assets/models/jianghai_old_city/jianghai_old_city.glb
          - Project composition license: MIT; retained as LICENSE-MIT.txt.
          - The selected Chinese temple, arcade-shop, and gate-house profiles are documented as adaptations of CC0 Chinese Temple 2, CC0 Chinese Four-corner Pavilion, and the recorded CC0 Quaternius Buildings Pack. Third-party rights remain their original licenses, not relicensed as MIT.
          - Exact source records and the retired/omitted asset list are retained in LICENSE_EVIDENCE.md and THIRD_PARTY_LICENSES.md.
          - The extracted world retains the authored street network, market bridge, 50 density placements, enterable residences, market props, pawnshop courtyard/entrance, tenement district, valley terrain, mountain ring, and factory/workshop district.
          - The factory workshop assets are retained for the game's forge/blacksmith district; interior shells are deferred to the later enterable-interiors phase.
          - Attribution: Hero Mountain by solararchitect (Sketchfab), CC BY 4.0, https://sketchfab.com/3d-models/hero-mountain-83b3fd690ea44e988d086d5165a5f2ca. Modified in the source project by decimation and scene transforms; attribution and license evidence are retained.
          - Perimeter terrain uses Coast Line 01 and Gravel Floor 03 by Poly Haven, CC0; source records are retained in LICENSE_EVIDENCE.md.
          - reports/phase1_chinese_district_extract.json records the exact selected nodes, geometry counts, output size, and SHA-256.
          EOF
          mkdir -p /tmp/phase1-gltf-tools
          npm install --prefix /tmp/phase1-gltf-tools --no-save @gltf-transform/core @gltf-transform/extensions @gltf-transform/functions
          cp tools/quality/extract_phase1_chinese_city.mjs /tmp/phase1-gltf-tools/extract.mjs
          node /tmp/phase1-gltf-tools/extract.mjs /tmp/phase1-city-source/jianghai_old_city.glb assets/environment/phase1/jianghai/chinese_district.glb reports/phase1_chinese_district_extract.json

      - name: Import project with Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot import
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee reports/phase1_godot_import.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR: Failed to load" reports/phase1_godot_import.log; then
            echo "Godot reported import or script errors"
            exit 1
          fi

      - name: Render visual evidence in Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --path . --rendering-method gl_compatibility --script res://tools/quality/Phase1ChineseDistrictPreview.gd 2>&1 | tee reports/phase1_chinese_district_preview.log
          test -s reports/phase1_chinese_district_preview.png
          test -s reports/phase1_chinese_district_closeup.png
          if grep -Eq 'SCRIPT ERROR:|ERROR: Node not inside tree|Parse Error:' reports/phase1_chinese_district_preview.log; then
            echo 'Godot visual preview reported a script or scene-tree error'
            exit 1
          fi

      - name: Commit acquired assets and audit evidence to phase branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/environment/phase1 reports/phase1_world_asset_manifest.json reports/phase1_chinese_district_extract.json reports/phase1_chinese_district_preview.png
          git add -f reports/phase1_chinese_district_closeup.png
          git diff --cached --quiet && { echo "No asset changes to commit"; exit 0; }
          git commit -m "Acquire and audit phase 1 production world assets"
          git push origin HEAD:stage/phase1-world-assets

      - name: Upload acquisition and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phase1-World-Asset-Visual-Audit
          path: |
            reports/phase1_world_asset_manifest.json
            reports/phase1_godot_import.log
            reports/phase1_visual_preview.log
            reports/phase1_chinese_district_extract.json
            reports/phase1_chinese_district_preview.log
            reports/phase1_chinese_district_preview.png
            reports/phase1_chinese_district_closeup.png
            assets/environment/phase1/SOURCES.md
          if-no-files-found: warn
          retention-days: 30
