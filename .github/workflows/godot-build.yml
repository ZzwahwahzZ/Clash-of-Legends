name: Clash of Legends - Build and Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-validation:
    name: Godot 4.3 Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify published PCK host supports safe HTTP range resume
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          manifest = json.loads(pathlib.Path("RESOURCE_MANIFEST").read_text(encoding="utf-8"))
          packages = manifest.get("resource_packages", [])
          target = next((item for item in packages if item.get("package_id") == "models"), None)
          if not target or not target.get("download_url"):
              raise SystemExit("Published models PCK URL is missing; range-resume capability cannot be verified.")
          request = urllib.request.Request(
              target["download_url"],
              headers={"Range": "bytes=0-1023", "Accept-Encoding": "identity", "User-Agent": "ClashOfLegends-RangeProbe/1.0"},
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              content_range = response.headers.get("Content-Range", "")
              body = response.read(2048)
              print(f"RANGE PROBE: HTTP {response.status}; Content-Range={content_range}; bytes={len(body)}")
              if response.status != 206 or not content_range.startswith("bytes 0-1023/") or len(body) != 1024:
                  raise SystemExit("Published PCK host does not provide a valid 206 byte-range response.")
          print("PCK RANGE SUPPORT VERIFIED: safe chunked resume is available.")
          PY

      - name: Enforce original-reference acceptance ledger
        run: python3 tools/quality/validate_acceptance_ledger.py

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Test Godot HTTPRequest byte-range downloads against the actual PCK host
        run: godot --headless --path . --script tools/quality/test_pck_range_http.gd

      - name: Import project
        run: |
          mkdir -p ci-logs
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee ci-logs/import.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR: Failed to load script|ERROR: Failed to create an autoload" ci-logs/import.log; then echo "Godot import contains script or autoload errors"; exit 1; fi

      - name: Run gameplay tests
        run: |
          set -o pipefail
          xvfb-run -a godot --path . --rendering-method gl_compatibility --scene res://scenes/core/TestRunnerScene.tscn --quit-after 2 2>&1 | tee ci-logs/gameplay-tests.log
          grep -Eq 'TEST RESULTS SUMMARY: .* \| 0 FAILED' ci-logs/gameplay-tests.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR: Failed to load script|ERROR: Failed to instantiate an autoload' ci-logs/gameplay-tests.log; then echo 'Gameplay tests emitted script errors'; exit 1; fi

      - name: Validate verified character model mapping
        run: |
          set -o pipefail
          godot --headless --path . --script tools/quality/validate_character_model_mapping.gd --quit-after 3 2>&1 | tee ci-logs/character-model-mapping.log
          grep -q "CHARACTER MODEL MAPPING AUDIT PASSED" ci-logs/character-model-mapping.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|CHARACTER MODEL MAPPING AUDIT FAILED" ci-logs/character-model-mapping.log; then echo "Character model mapping audit failed"; exit 1; fi

      - name: Validate source-backed class identities and weapon families
        run: |
          set -o pipefail
          godot --headless --path . --script tools/quality/validate_class_source_parity.gd --quit-after 3 2>&1 | tee ci-logs/class-source-parity.log
          grep -q "CLASS SOURCE PARITY PASSED" ci-logs/class-source-parity.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|CLASS SOURCE PARITY FAILED" ci-logs/class-source-parity.log; then echo "Class source parity audit failed"; exit 1; fi

      - name: Run visual audit
        run: |
          set -o pipefail
          xvfb-run -a godot --path . --rendering-method gl_compatibility --scene res://scenes/core/VisualAuditScene.tscn 2>&1 | tee ci-logs/visual-audit.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR: Failed to load script|ERROR: Failed to instantiate an autoload" ci-logs/visual-audit.log; then echo "Visual audit emitted script errors"; exit 1; fi

      - name: Validate automatic loot category filters
        run: |
          set -o pipefail
          ALSOFT_DRIVERS=null xvfb-run -a godot --path . --rendering-method gl_compatibility --scene res://tools/resource_packs/validate_loot_filters.tscn 2>&1 | tee ci-logs/loot-filters.log
          grep -q "LOOT FILTER AUDIT PASSED" ci-logs/loot-filters.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|LOOT FILTER AUDIT FAILED" ci-logs/loot-filters.log; then echo "Loot filter audit failed"; exit 1; fi

      - name: Validate gameplay collision shapes
        run: |
          set -o pipefail
          ALSOFT_DRIVERS=null xvfb-run -a godot --path . --rendering-method gl_compatibility --script tools/resource_packs/validate_physics_shapes.gd 2>&1 | tee ci-logs/physics-audit.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|PHYSICS SHAPE AUDIT FAILED" ci-logs/physics-audit.log; then echo "Physics acceptance audit failed"; exit 1; fi

      - name: Test real Player versus WildWolf collision
        run: |
          set -o pipefail
          ALSOFT_DRIVERS=null xvfb-run -a godot --path . --rendering-method gl_compatibility --script tools/resource_packs/validate_runtime_collisions.gd 2>&1 | tee ci-logs/runtime-collision.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|RUNTIME COLLISION AUDIT FAILED" ci-logs/runtime-collision.log; then echo "Runtime collision test failed"; exit 1; fi

      - name: Test manual and quest instant travel
        run: |
          set -o pipefail
          ALSOFT_DRIVERS=null xvfb-run -a godot --path . --rendering-method gl_compatibility --script tools/resource_packs/validate_world_travel.gd 2>&1 | tee ci-logs/world-travel.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|WORLD TRAVEL AUDIT FAILED" ci-logs/world-travel.log; then echo "World travel test failed"; exit 1; fi

      - name: Enforce production visual assets (no primitive blockouts)
        run: python3 tools/quality/reject_visual_blockouts.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs
          path: ci-logs/
          if-no-files-found: warn

  android-apk:
    name: Android 13 - Signed APK Export and Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      # This stable CI-only debug key is cached so successive debug APKs keep
      # the same signer. It is not a production/release signing identity.
      - name: Restore persistent CI debug signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: clash-of-legends-android-debug-signing-v1

      - name: Create CI debug signing key when needed
        run: |
          mkdir -p .ci-signing builds/android/signing
          if [ ! -s .ci-signing/debug.keystore ]; then
            keytool -genkeypair -v               -keystore .ci-signing/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=Clash of Legends Debug,O=ZzwahwahzZ,C=EG"
          fi
          cp .ci-signing/debug.keystore builds/android/signing/debug.keystore
          keytool -list -keystore builds/android/signing/debug.keystore -storepass android -alias androiddebugkey

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Bundle verified world and model packs into the APK
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          manifest = json.loads(pathlib.Path("RESOURCE_MANIFEST").read_text())
          selected = {"maps", "models"}
          pathlib.Path("bundled").mkdir(exist_ok=True)
          total = 0
          for entry in manifest["resource_packages"]:
              if entry["package_id"] not in selected:
                  continue
              destination = pathlib.Path("bundled") / entry["file_name"]
              print(f"Downloading bundled pack: {entry['package_id']} ({entry['size_bytes']} bytes)")
              urllib.request.urlretrieve(entry["download_url"], destination)
              data_hash = hashlib.sha256(destination.read_bytes()).hexdigest()
              if destination.stat().st_size != int(entry["size_bytes"]) or data_hash != entry["sha256"]:
                  raise SystemExit(f"Bundled pack integrity check failed: {entry['package_id']}")
              total += destination.stat().st_size
          if total == 0:
              raise SystemExit("No bundled resource packs were staged")
          print(f"Verified bundled APK resources: {total} bytes")
          PY

      - name: Import Godot project
        run: godot --headless --editor --path . --quit

      - name: Export signed Android APK
        run: |
          set -euo pipefail
          mkdir -p builds/android
          godot --headless --path . --export-debug "Android" builds/android/ClashOfLegends-debug.apk
          test -s builds/android/ClashOfLegends-debug.apk
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          apk = pathlib.Path("builds/android/ClashOfLegends-debug.apk")
          manifest = json.loads(pathlib.Path("RESOURCE_MANIFEST").read_text())
          expected = {e["package_id"]: e for e in manifest["resource_packages"] if e["package_id"] in {"maps", "models"}}
          if set(expected) != {"maps", "models"}:
              raise SystemExit("Manifest does not define both required bundled packs")
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              for package_id, entry in expected.items():
                  suffix = "/bundled/" + entry["file_name"]
                  matches = [name for name in names if name.endswith(suffix)]
                  if len(matches) != 1:
                      raise SystemExit(f"Expected exactly one embedded {package_id} pack; found {matches}")
                  info = z.getinfo(matches[0])
                  if info.file_size != int(entry["size_bytes"]):
                      raise SystemExit(f"Embedded {package_id} size mismatch: {info.file_size}")
                  digest = hashlib.sha256()
                  with z.open(info) as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(chunk)
                  if digest.hexdigest() != entry["sha256"]:
                      raise SystemExit(f"Embedded {package_id} SHA-256 mismatch")
                  print(f"APK RESOURCE VERIFIED: {package_id} {info.file_size} bytes SHA-256 OK at {matches[0]}")
              icon_entries = [n for n in names if n.endswith("/mipmap-xxxhdpi-v4/icon.png")]
              if not icon_entries:
                  raise SystemExit("Android launcher icon is missing from APK")
              import struct
              icon_data = z.read(icon_entries[0])
              if not icon_data.startswith(bytes.fromhex("89504e470d0a1a0a")):
                  raise SystemExit("Android launcher icon is not a valid PNG")
              width, height = struct.unpack(">II", icon_data[16:24])
              if width < 192 or height < 192:
                  raise SystemExit(f"Android launcher icon is too small: {width}x{height}")
              if len(icon_data) < 2048:
                  raise SystemExit("Android launcher icon payload is unexpectedly small")
              print(f"ANDROID LAUNCHER ICON VERIFIED: {icon_entries[0]} ({width}x{height}, {len(icon_data)} bytes)")
          print(f"APK EXPORT PASSED: {apk.stat().st_size} bytes")
          PY

      - name: Verify APK archive, signature, package id and Android compatibility
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          APK="builds/android/ClashOfLegends-debug.apk"
          unzip -t "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee builds/android/signature-verification.txt
          APK_ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APK_ANALYZER"
          PACKAGE_ID="$("$APK_ANALYZER" manifest application-id "$APK")"
          MIN_SDK="$("$APK_ANALYZER" manifest min-sdk "$APK")"
          TARGET_SDK="$("$APK_ANALYZER" manifest target-sdk "$APK")"
          {
            echo "package: name='$PACKAGE_ID'"
            echo "sdkVersion:'$MIN_SDK'"
            echo "targetSdkVersion:'$TARGET_SDK'"
          } | tee builds/android/apk-badging.txt
          test "$PACKAGE_ID" = "com.zwahwahzz.clashoflegends"
          test -n "$MIN_SDK" && test -n "$TARGET_SDK"
          test "$MIN_SDK" -ge 21
          test "$TARGET_SDK" -ge 33
          test "$TARGET_SDK" -le 34
          echo "Android SDK compatibility verified: min=$MIN_SDK target=$TARGET_SDK"
          grep -q "Signer #1 certificate SHA-256 digest" builds/android/signature-verification.txt
          (cd builds/android && sha256sum ClashOfLegends-debug.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          {
            echo "Package: com.zwahwahzz.clashoflegends"
            echo "Minimum Android API: $MIN_SDK"
            echo "Target Android API: $TARGET_SDK"
            echo "Compatibility check: Android 13 (API 33)"
            echo "Architecture: ARM64-v8a"
            echo "Signature: verified CI debug signature"
            echo "APK size: $(stat -c%s "$APK") bytes"
          } > builds/android/INSTALL-INFO.txt
          cat builds/android/SHA256SUMS.txt
          cat builds/android/INSTALL-INFO.txt

      - name: Export x86_64 emulator-only APK without changing the phone release APK
        run: |
          set -euo pipefail
          cp export_presets.cfg export_presets.arm64-backup.cfg
          restore_preset() { mv -f export_presets.arm64-backup.cfg export_presets.cfg; }
          trap restore_preset EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path("export_presets.cfg")
          s=p.read_text()
          s=s.replace("architectures/arm64-v8a=true", "architectures/arm64-v8a=false")
          s=s.replace("architectures/x86_64=false", "architectures/x86_64=true")
          if "architectures/arm64-v8a=false" not in s or "architectures/x86_64=true" not in s:
              raise SystemExit("Could not configure x86_64 emulator export preset")
          p.write_text(s)
          PY
          godot --headless --path . --export-debug "Android" builds/android/ClashOfLegends-emulator-x86_64.apk
          test -s builds/android/ClashOfLegends-emulator-x86_64.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify builds/android/ClashOfLegends-emulator-x86_64.apk
          EMULATOR_APK="builds/android/ClashOfLegends-emulator-x86_64.apk"
          unzip -t "$EMULATOR_APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$EMULATOR_APK"
          unzip -l "$EMULATOR_APK" | grep -q "lib/x86_64/"
          echo "EMULATOR APK VERIFIED: valid archive, signed, and contains x86_64 native libraries."
          echo "EMULATOR APK EXPORTED: x86_64 test build; ARM64 phone APK remains unchanged."
          restore_preset
          trap - EXIT

      - name: Upload verified Android APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ClashOfLegends-Android13-SIGNED-VERIFIED
          path: |
            builds/android/ClashOfLegends-debug.apk
            builds/android/ClashOfLegends-emulator-x86_64.apk
            builds/android/SHA256SUMS.txt
            builds/android/INSTALL-INFO.txt
            builds/android/signature-verification.txt
            builds/android/apk-badging.txt
          if-no-files-found: error
          retention-days: 30

  # Full device smoke runs are enabled for manual dispatches and [audit-packs] pushes.
  android-emulator-smoke:
    name: Android 13 Emulator - Player Experience Smoke Test
    needs: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository for emulator test helpers
        uses: actions/checkout@v4

      - name: Download signed Android APK
        uses: actions/download-artifact@v4
        with:
          name: ClashOfLegends-Android13-SIGNED-VERIFIED
          path: builds/android

      - name: Verify APK exists
        run: |
          test -s builds/android/ClashOfLegends-debug.apk
          test -s builds/android/ClashOfLegends-emulator-x86_64.apk
          mkdir -p emulator-evidence

      - name: Install Pillow and validate screenshot-aware emulator helpers
        run: |
          python3 -m pip install --user Pillow
          python3 -m py_compile tools/ci/tap_start_button.py tools/ci/assert_world_transition.py tools/ci/wait_for_world_entry.py
          python3 tools/ci/test_android_emulator_helpers.py

      - name: Enable KVM acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android 13 phone emulator and exercise the game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            # Approximate Redmi Note 11's 1080x2400 portrait display and density.
            adb shell wm size 1080x2400
            adb shell wm density 395
            adb shell wm size | tee emulator-evidence/display-size.txt
            adb shell wm density | tee emulator-evidence/display-density.txt
            adb shell getprop ro.build.version.sdk | tee emulator-evidence/android-api.txt
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "33"
            adb install -r builds/android/ClashOfLegends-emulator-x86_64.apk
            adb logcat -c
            # Preserve device diagnostics even when an early visual assertion fails.
            trap 'adb logcat -d -t 16000 > emulator-evidence/logcat.txt || true' EXIT
            adb shell monkey -p com.zwahwahzz.clashoflegends 1
            # Godot's Android splash can outlive the first second on software-rendered CI.
            # Capture it, then allow the actual CanvasItem-based intro and its timed fade to finish.
            sleep 1
            adb shell pidof com.zwahwahzz.clashoflegends > emulator-evidence/game-pid.txt || { adb logcat -d -t 16000 > emulator-evidence/logcat-failure.txt; echo "Game process exited after launch."; exit 1; }
            adb shell screencap -p /sdcard/clash-launch.png
            adb pull /sdcard/clash-launch.png emulator-evidence/launch-screen.png
            # Dismiss Android 13's first-run immersive-mode notice after the splash has rendered.
            # The "Got it" target is centered near (1500, 500) on the 2400x1080 emulator.
            # (The captured image is rendered scaled in reports; use native framebuffer coordinates.)
            sleep 2
            adb shell input tap 1500 500
            sleep 0.5
            adb shell screencap -p /sdcard/clash-intro.png
            adb pull /sdcard/clash-intro.png emulator-evidence/intro-screen.png
            # LegendIntro.gd fades its cinematic overlay automatically after about 3.85 seconds.
            sleep 4
            adb shell screencap -p /sdcard/clash-character-select.png
            adb pull /sdcard/clash-character-select.png emulator-evidence/character-select.png
            python3 tools/ci/compare_emulator_screens.py emulator-evidence/intro-screen.png emulator-evidence/character-select.png 600,250,1800,800 --minimum-ratio 0.02
            # Detect the gold button and Arabic label in the screenshot, then tap its measured center.
            python3 tools/ci/tap_start_button.py emulator-evidence/character-select.png
            # First-run resource packs total about 1.13 GB; wait for verified downloads rather than
            # misclassifying the still-visible start label behind the RTL progress overlay as a stuck screen.
            python3 tools/ci/wait_for_world_entry.py emulator-evidence/character-select.png emulator-evidence --timeout-seconds 1200 --poll-seconds 10
            # Preserve a short in-world visual recording before attempting any control coordinates.
            adb shell screenrecord --time-limit 12 /sdcard/clash-world-idle.mp4 >/dev/null 2>&1 &
            SCREENRECORD_PID=$!
            sleep 12
            wait "$SCREENRECORD_PID" || true
            adb pull /sdcard/clash-world-idle.mp4 emulator-evidence/world-idle.mp4 || echo "SCREENRECORD_UNAVAILABLE" > emulator-evidence/screenrecord-status.txt
            adb shell screencap -p /sdcard/clash-world-idle.png
            adb pull /sdcard/clash-world-idle.png emulator-evidence/world-idle.png
            adb shell uiautomator dump /sdcard/clash-window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/clash-window.xml emulator-evidence/window-hierarchy.xml || true
            adb shell dumpsys meminfo com.zwahwahzz.clashoflegends > emulator-evidence/memory.txt
            adb shell dumpsys gfxinfo com.zwahwahzz.clashoflegends > emulator-evidence/graphics.txt
            adb logcat -d -t 16000 > emulator-evidence/logcat.txt
            grep -E "FATAL EXCEPTION|Fatal signal|SIGSEGV" emulator-evidence/logcat.txt && { echo "Fatal Android runtime error detected."; exit 1; } || true
            echo "ANDROID EMULATOR SMOKE TEST PASSED: intro dismissal, screenshot-verified Arabic start-button tap, world entry, and idle video/performance evidence collected."
      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClashOfLegends-Android13-Emulator-Evidence
          path: emulator-evidence/
          if-no-files-found: warn
          retention-days: 30

  studio-build:
    name: React Studio Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build studio
        run: npm run build
  resource-pack-audit:
    name: Published Resource Pack Integrity and Runtime Content Audit
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[audit-packs]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Download and verify every published resource pack
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.request

          manifest = json.loads(pathlib.Path("RESOURCE_MANIFEST").read_text(encoding="utf-8"))
          entries = manifest.get("resource_packages", [])
          if len(entries) != 11:
              raise SystemExit(f"Expected 11 published resource packs, found {len(entries)}")
          destination = pathlib.Path("ci-resource-packs")
          destination.mkdir(exist_ok=True)
          total_bytes = 0
          for entry in entries:
              name = entry["file_name"]
              url = entry["download_url"]
              expected_size = int(entry["size_bytes"])
              expected_hash = entry["sha256"].lower()
              if not url.startswith("https://"):
                  raise SystemExit(f"Refusing non-HTTPS resource URL: {url}")
              path = destination / name
              digest = hashlib.sha256()
              received = 0
              request = urllib.request.Request(url, headers={"User-Agent": "ClashOfLegends-ResourceAudit/1.0"})
              with urllib.request.urlopen(request, timeout=120) as response, path.open("wb") as output:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      output.write(chunk)
                      digest.update(chunk)
                      received += len(chunk)
              if received != expected_size:
                  raise SystemExit(f"{name}: size mismatch: {received} != {expected_size}")
              actual_hash = digest.hexdigest()
              if actual_hash != expected_hash:
                  raise SystemExit(f"{name}: SHA-256 mismatch: {actual_hash}")
              total_bytes += received
              print(f"PACK VERIFIED: {name} | {received} bytes | SHA-256 OK")
          print(f"ALL 11 RESOURCE PACKS VERIFIED: {total_bytes} bytes")
          PY

      - name: Prepare verified PCK extraction inputs
        run: |
          mkdir -p build/source_packs reports
          cp ci-resource-packs/*.pck build/source_packs/
          base="https://github.com/ZzwahwahzZ/Clash-of-Legends/releases/download/resource-packs-v4"
          curl --fail --location --retry 5 --retry-all-errors "$base/resource-source-index.csv" -o resource-source-index.csv
          python3 tools/resource_packs/prepare_pck_paths.py

      - name: Rehydrate exact source files from verified PCKs
        run: godot --headless --path . --script tools/resource_packs/extract_resource_packs.gd

      - name: Build provenance-preserving runtime resource catalog
        run: python3 tools/resource_packs/build_runtime_resource_catalog.py

      - name: Mount packs and inspect actual runtime 3D resources
        run: |
          set -o pipefail
          godot --headless --path . --script tools/quality/audit_resource_pack_contents.gd 2>&1 | tee resource-pack-audit.log
          test -s resource-pack-audit.json
          grep -q "RESOURCE PACK CONTENT AUDIT:" resource-pack-audit.log

      - name: Upload resource audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClashOfLegends-Resource-Pack-Audit
          path: |
            resource-pack-audit.json
            resource-pack-audit.log
            /tmp/clash-dmap-format-sample.bin
          if-no-files-found: warn
          retention-days: 30
