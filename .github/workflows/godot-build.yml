name: Clash of Legends - Build and Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-validation:
    name: Godot 4.3 Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce original-reference acceptance ledger
        run: python3 tools/quality/validate_acceptance_ledger.py

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: |
          mkdir -p ci-logs
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee ci-logs/import.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR: Failed to load script|ERROR: Failed to create an autoload" ci-logs/import.log; then echo "Godot import contains script or autoload errors"; exit 1; fi

      - name: Run gameplay tests
        run: |
          set -o pipefail
          godot --headless --path . --scene res://scenes/core/TestRunnerScene.tscn --quit-after 2 2>&1 | tee ci-logs/gameplay-tests.log
          grep -Eq 'TEST RESULTS SUMMARY: .* \| 0 FAILED' ci-logs/gameplay-tests.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR: Failed to load script|ERROR: Failed to instantiate an autoload' ci-logs/gameplay-tests.log; then echo 'Gameplay tests emitted script errors'; exit 1; fi

      - name: Run visual audit
        run: |
          set -o pipefail
          godot --headless --path . --scene res://scenes/core/VisualAuditScene.tscn 2>&1 | tee ci-logs/visual-audit.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR: Failed to load script|ERROR: Failed to instantiate an autoload" ci-logs/visual-audit.log; then echo "Visual audit emitted script errors"; exit 1; fi

      - name: Validate automatic loot category filters
        run: |
          set -o pipefail
          godot --headless --path . --script tools/resource_packs/validate_loot_filters.gd 2>&1 | tee ci-logs/loot-filters.log
          grep -q "LOOT FILTER AUDIT PASSED" ci-logs/loot-filters.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|LOOT FILTER AUDIT FAILED" ci-logs/loot-filters.log; then echo "Loot filter audit failed"; exit 1; fi

      - name: Validate gameplay collision shapes
        run: |
          set -o pipefail
          godot --headless --path . --script tools/resource_packs/validate_physics_shapes.gd 2>&1 | tee ci-logs/physics-audit.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|PHYSICS SHAPE AUDIT FAILED" ci-logs/physics-audit.log; then echo "Physics acceptance audit failed"; exit 1; fi

      - name: Test real Player versus WildWolf collision
        run: |
          set -o pipefail
          godot --headless --path . --script tools/resource_packs/validate_runtime_collisions.gd 2>&1 | tee ci-logs/runtime-collision.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|RUNTIME COLLISION AUDIT FAILED" ci-logs/runtime-collision.log; then echo "Runtime collision test failed"; exit 1; fi

      - name: Test manual and quest instant travel
        run: |
          set -o pipefail
          godot --headless --path . --script tools/resource_packs/validate_world_travel.gd 2>&1 | tee ci-logs/world-travel.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|WORLD TRAVEL AUDIT FAILED" ci-logs/world-travel.log; then echo "World travel test failed"; exit 1; fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs
          path: ci-logs/
          if-no-files-found: warn

  android-apk:
    name: Android 13 - Signed APK Export and Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      # This stable CI-only debug key is cached so successive debug APKs keep
      # the same signer. It is not a production/release signing identity.
      - name: Restore persistent CI debug signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: clash-of-legends-android-debug-signing-v1

      - name: Create CI debug signing key when needed
        run: |
          mkdir -p .ci-signing builds/android/signing
          if [ ! -s .ci-signing/debug.keystore ]; then
            keytool -genkeypair -v               -keystore .ci-signing/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=Clash of Legends Debug,O=ZzwahwahzZ,C=EG"
          fi
          cp .ci-signing/debug.keystore builds/android/signing/debug.keystore
          keytool -list -keystore builds/android/signing/debug.keystore -storepass android -alias androiddebugkey

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Import Godot project
        run: godot --headless --editor --path . --quit

      - name: Export signed Android APK
        run: |
          mkdir -p builds/android
          godot --headless --path . --export-debug "Android" builds/android/ClashOfLegends-debug.apk
          test -s builds/android/ClashOfLegends-debug.apk
          test "$(stat -c%s builds/android/ClashOfLegends-debug.apk)" -gt 1048576

      - name: Verify APK archive, signature, package id and Android compatibility
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          APK="builds/android/ClashOfLegends-debug.apk"
          unzip -t "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee builds/android/signature-verification.txt
          APK_ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APK_ANALYZER"
          PACKAGE_ID="$("$APK_ANALYZER" manifest application-id "$APK")"
          MIN_SDK="$("$APK_ANALYZER" manifest min-sdk "$APK")"
          TARGET_SDK="$("$APK_ANALYZER" manifest target-sdk "$APK")"
          {
            echo "package: name='$PACKAGE_ID'"
            echo "sdkVersion:'$MIN_SDK'"
            echo "targetSdkVersion:'$TARGET_SDK'"
          } | tee builds/android/apk-badging.txt
          test "$PACKAGE_ID" = "com.zwahwahzz.clashoflegends"
          test -n "$MIN_SDK" && test -n "$TARGET_SDK"
          test "$MIN_SDK" -ge 21
          test "$TARGET_SDK" -ge 33
          test "$TARGET_SDK" -le 34
          echo "Android SDK compatibility verified: min=$MIN_SDK target=$TARGET_SDK"
          grep -q "Signer #1 certificate SHA-256 digest" builds/android/signature-verification.txt
          (cd builds/android && sha256sum ClashOfLegends-debug.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          {
            echo "Package: com.zwahwahzz.clashoflegends"
            echo "Minimum Android API: $MIN_SDK"
            echo "Target Android API: $TARGET_SDK"
            echo "Compatibility check: Android 13 (API 33)"
            echo "Architecture: ARM64-v8a"
            echo "Signature: verified CI debug signature"
            echo "APK size: $(stat -c%s "$APK") bytes"
          } > builds/android/INSTALL-INFO.txt
          cat builds/android/SHA256SUMS.txt
          cat builds/android/INSTALL-INFO.txt

      - name: Upload verified Android APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ClashOfLegends-Android13-SIGNED-VERIFIED
          path: |
            builds/android/ClashOfLegends-debug.apk
            builds/android/SHA256SUMS.txt
            builds/android/INSTALL-INFO.txt
            builds/android/signature-verification.txt
            builds/android/apk-badging.txt
          if-no-files-found: error
          retention-days: 30

  studio-build:
    name: React Studio Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build studio
        run: npm run build
