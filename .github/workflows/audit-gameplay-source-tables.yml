name: Audit mobile gameplay source tables
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-gameplay-source-tables.yml"
      - "tools/gameplay_source_audit/**"
permissions:
  contents: read
concurrency:
  group: gameplay-source-table-audit-${{ github.sha }}
  cancel-in-progress: true
jobs:
  audit-source-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the exact mobile source archive
        run: |
          set -euo pipefail
          mkdir -p build/source reports
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/ZzwahwahzZ/Conquer-Mobile-Assets./releases/download/mobile-extracted-assets/extracted-assets-001.zip" \
            -o build/source/extracted-assets-001.zip
          echo "0d21a110c09b762ed5f1a5f4da022857b0534e489eb85052d15da460cb229d2a  build/source/extracted-assets-001.zip" | sha256sum -c -
      - name: Install specialized Android and binary analysis tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool default-jre-headless unzip
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" \
            -o /tmp/jadx-1.5.6.zip
          echo "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  /tmp/jadx-1.5.6.zip" | sha256sum -c -
          sudo unzip -q /tmp/jadx-1.5.6.zip -d /opt
          JADX_BIN="$(find /opt -maxdepth 4 -type f -path '*/bin/jadx' -print -quit)"
          test -n "$JADX_BIN"
          sudo chmod +x "$JADX_BIN"
          sudo ln -sf "$JADX_BIN" /usr/local/bin/jadx
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check polyfile androguard==4.1.4
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          apktool --version
          jadx --version
          androguard --version || true
          python3 -m py_compile tools/gameplay_source_audit/comprehensive_asset_inventory.py tools/gameplay_source_audit/audit_source_tables.py tools/gameplay_source_audit/quest_source_extractor.py tools/gameplay_source_audit/androguard_deep_analysis.py
      - name: Recursively inventory every archive member by content
        run: |
          python3 tools/gameplay_source_audit/comprehensive_asset_inventory.py \
            build/source/extracted-assets-001.zip \
            --output reports/comprehensive-asset-inventory.json \
            --polyfile-report reports/polyfile-mobile.sbud.json
          python3 -m json.tool reports/comprehensive-asset-inventory.json > /dev/null
      - name: Inventory and parse safe source fields
        run: |
          python3 tools/gameplay_source_audit/audit_source_tables.py \
            build/source/extracted-assets-001.zip \
            --lookup-item-ids 500239 \
            --output reports/gameplay-source-table-audit.json
      - name: Extract all Mobile quest, task, NPC, dialogue and action candidates
        run: |
          python3 tools/gameplay_source_audit/quest_source_extractor.py \
            build/source/extracted-assets-001.zip \
            --output-dir reports/quest-source-extraction \
            --report reports/quest-source-extraction.json
          python3 -m json.tool reports/quest-source-extraction.json > /dev/null
      - name: Analyze all four exact APK components with Androguard, Apktool and JADX
        run: |
          set -euo pipefail
          mkdir -p build/apks reports/android-analysis
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          archive=Path("build/source/extracted-assets-001.zip")
          targets=[
            "ConquerOnline/ConquerOnline-1.1.2.3.apk",
            "ConquerOnline/config.arm64_v8a.apk",
            "ConquerOnline/config.xxhdpi.apk",
            "ConquerOnline/install_time_1001.apk",
          ]
          with zipfile.ZipFile(archive) as z:
            names=set(z.namelist())
            missing=[x for x in targets if x not in names]
            if missing:
              raise SystemExit("Missing required APK components: "+repr(missing))
            for i,name in enumerate(targets):
              out=Path("build/apks")/(f"{i:02d}-"+Path(name).name)
              with z.open(name) as src,out.open("wb") as dst:
                import shutil
                shutil.copyfileobj(src,dst,1024*1024)
              print(f"EXTRACTED {name} -> {out} ({out.stat().st_size} bytes)")
          PY
          for apk in build/apks/*.apk; do
            base="$(basename "$apk" .apk)"
            echo "=== ANDROGUARD APK ID: $base ==="
            androguard apkid "$apk" > "reports/android-analysis/$base.androguard.txt" 2>&1 || true
            echo "=== APKTOOL RESOURCE DECODE: $base ==="
            apktool d --force --no-src "$apk" -o "reports/android-analysis/$base.apktool" > "reports/android-analysis/$base.apktool.log" 2>&1
            echo "=== JADX DEX DECOMPILE: $base ==="
            jadx --no-res --show-bad-code -d "reports/android-analysis/$base.jadx" "$apk" > "reports/android-analysis/$base.jadx.log" 2>&1
            find "reports/android-analysis/$base.jadx" -type f \( -name '*.java' -o -name '*.kt' \) | wc -l
          done
          python3 tools/gameplay_source_audit/androguard_deep_analysis.py \
            --apk-dir build/apks \
            --output-dir reports/android-analysis
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("reports/android-analysis")
          out={"tools":{"androguard":"4.1.4","apktool":True,"jadx":True},"apk_components":[]}
          for p in sorted(Path("build/apks").glob("*.apk")):
            base=p.stem
            dec=root/(base+".jadx")
            resources=root/(base+".apktool")
            out["apk_components"].append({
              "apk":p.name,"size_bytes":p.stat().st_size,
              "androguard_report":(root/(base+".androguard.txt")).exists(),
              "apktool_decoded":resources.exists(),
              "jadx_decompiled":dec.exists(),
              "java_source_files":sum(1 for _ in dec.rglob("*.java")) if dec.exists() else 0,
              "native_libraries":[str(x.relative_to(resources)) for x in resources.rglob("*.so")] if resources.exists() else []
            })
          (root/"android-analysis-summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - name: Validate reports and print concise inventory
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("reports/quest-source-extraction.json").read_text(encoding="utf-8"))
          data=json.loads(Path("reports/gameplay-source-table-audit.json").read_text(encoding="utf-8"))
          inventory=json.loads(Path("reports/comprehensive-asset-inventory.json").read_text(encoding="utf-8"))
          android=json.loads(Path("reports/android-analysis/android-analysis-summary.json").read_text(encoding="utf-8"))\n          deep=json.loads(Path("reports/android-analysis/androguard-deep-analysis.json").read_text(encoding="utf-8"))
          print("QUEST SOURCE EXTRACTOR:", q["source_version"])
          print("Expected APKs:", json.dumps(q.get("expected_apk_paths", []), ensure_ascii=False))
          print("Found APKs:", json.dumps(q.get("mobile_apk_candidates", []), ensure_ascii=False))
          print("Missing APKs:", json.dumps(q.get("missing_expected_apks", []), ensure_ascii=False))
          print("APK member counts:", json.dumps(q.get("apk_member_counts", []), ensure_ascii=False))
          print("Candidate files:", q["candidate_count"])
          print("Filename matches:", q["filename_match_count"])
          print("Content/code matches:", q["content_match_count"])
          print("Extracted files:", q["extracted_file_count"])
          print("Bundle bytes:", q["output_bundle_size_bytes"])
          print("Oversize skipped:", len(q["oversize_skipped"]))
          print("Read errors:", len(q["read_errors"]))
          print("Version-matched members:", data["version_matched_member_count"])
          print("Total inventory records:", inventory["total_inventory_records"])
          print("Android specialized analysis:", json.dumps(android, ensure_ascii=False))
          print("Androguard deep DEX/XREF summary:", json.dumps({"apk_count":deep["apk_count"],"success_count":len(deep["results"]),"error_count":len(deep["errors"]),"task_string_hits":sum(len(x["quest_task_string_hits"]) for x in deep["results"])}, ensure_ascii=False))
          print("Itemtype files/records:", data["itemtype_catalog"]["file_count"], data["itemtype_catalog"]["record_count"])
          print("Unlabelled column-59 candidates:", data["itemtype_catalog"].get("column_59_candidate_count", 0))
          for category, value in data["categories"].items():
              print(category, value["file_count"])
          candidates = data.get("quest_promotion_candidate_inventory", {})
          print("Quest/promotion candidate paths:", candidates.get("file_count", 0))
          print("Archer/promotion text hits:", json.dumps(candidates.get("text_hits", []), ensure_ascii=False))
          reader = data.get("android_reader_candidate_inventory", {})
          print("Android DEX/SO/JAR candidates:", reader.get("file_count", 0))
          print("Android reader string hits:", json.dumps(reader.get("raw_string_hits", []), ensure_ascii=False))
          PY
      - name: Upload source table and Android analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gameplay-Source-Table-Audit
          path: |
            reports/gameplay-source-table-audit.json
            reports/comprehensive-asset-inventory.json
            reports/polyfile-mobile-*.json
            reports/quest-source-extraction.json
            reports/quest-source-extraction/quest-source-candidates.zip
            reports/android-analysis/
          if-no-files-found: error
          retention-days: 30
