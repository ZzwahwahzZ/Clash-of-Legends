name: Extract exact-version world content sources
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/extract-world-content-source.yml"
      - "tools/gameplay_source_audit/extract_world_content_sources.py"
      - "tools/gameplay_source_audit/build_runtime_world_index.py"
      - "tools/gameplay_source_audit/parse_dialogue_sources.py"
      - "tools/gameplay_source_audit/validate_runtime_world_index.py"
      - "scripts/world/WorldContentIndex.gd"
      - "scripts/ui/DialogueUI.gd"
      - "scripts/npcs/NPCBase.gd"
      - "scenes/core/MainGame.tscn"
      - "scripts/world/WorldTravelManager.gd"
      - "scripts/automation/QuestNavigationAgent.gd"
      - "scripts/progression/ClassProgressionManager.gd"
      - "tools/resource_packs/validate_world_content_index.gd"
      - "project.godot"
permissions:
  contents: write
concurrency:
  group: world-content-source-extraction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extract-world-content:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Download and verify exact Mobile 1.1.2.3 source archive
        run: |
          set -euo pipefail
          mkdir -p build/source build/world-content-source reports data
          curl --fail --location --retry 5 --retry-all-errors "https://github.com/ZzwahwahzZ/Conquer-Mobile-Assets./releases/download/mobile-extracted-assets/extracted-assets-001.zip" -o build/source/extracted-assets-001.zip
          echo "0d21a110c09b762ed5f1a5f4da022857b0534e489eb85052d15da460cb229d2a  build/source/extracted-assets-001.zip" | sha256sum -c -
      - name: Extract exact-version map, NPC, quest and dialogue source members
        run: |
          python3 tools/gameplay_source_audit/extract_world_content_sources.py build/source/extracted-assets-001.zip --output-dir build/world-content-source --report reports/world-content-source-subset.json
          python3 -m json.tool reports/world-content-source-subset.json > /dev/null
      - name: Build localized runtime world index
        run: |
          python3 tools/gameplay_source_audit/build_runtime_world_index.py --source-dir build/world-content-source --output data/world_content_index.json --report reports/world-content-index-validation.json
          python3 -m json.tool data/world_content_index.json > /dev/null
          python3 tools/gameplay_source_audit/validate_runtime_world_index.py data/world_content_index.json
          python3 -m json.tool reports/world-content-index-validation.json > /dev/null
      - name: Setup Godot 4.3 for runtime index validation
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Import project and validate live Godot world index
        run: |
          set -o pipefail
          mkdir -p ci-logs
          godot --headless --editor --path . --quit 2>&1 | tee ci-logs/import.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR: Failed to load script|ERROR: Failed to create an autoload" ci-logs/import.log; then
            echo "Godot import reported a script or autoload error."
            exit 1
          fi
          godot --headless --path . --script tools/resource_packs/validate_world_content_index.gd --quit-after 5 2>&1 | tee ci-logs/world-index.log
          grep -q "RUNTIME WORLD CONTENT INDEX AUDIT PASSED" ci-logs/world-index.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|RUNTIME WORLD CONTENT INDEX AUDIT FAILED" ci-logs/world-index.log; then
            echo "Runtime world index failed its Godot audit."
            exit 1
          fi
      - name: Mark generated report with successful Godot runtime validation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("reports/world-content-index-validation.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          report["validation"] = "GODOT_RUNTIME_AUDIT_PASSED"
          report["godot_runtime_validation"] = {
              "engine": "Godot 4.3",
              "status": "PASSED",
              "log": "ci-logs/world-index.log"
          }
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8")
          json.loads(path.read_text(encoding="utf-8"))
          PY
      - name: Commit generated runtime index to this feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world_content_index.json reports/world-content-index-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate localized runtime world content index"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "Generated runtime world index is already current."
          fi
      - name: Upload source subset and index validation
        uses: actions/upload-artifact@v4
        with:
          name: World-Dialogue-Quest-Source-Subset
          path: |
            build/world-content-source/
            data/world_content_index.json
            reports/world-content-source-subset.json
            reports/world-content-index-validation.json
            ci-logs/
          if-no-files-found: error
          retention-days: 30
