name: Extract original Conquer mobile asset packages
on:
  push:
    paths:
      - .github/workflows/extract-conquer-asset-packages.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract-asset-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify source archive
        run: |
          set -euo pipefail
          mkdir -p build/source extracted reports
          curl --fail --location --retry 5 --retry-all-errors 'https://github.com/ZzwahwahzZ/Conquer-Mobile-Assets./releases/download/mobile-extracted-assets/extracted-assets-001.zip' -o build/source/extracted-assets-001.zip
          echo '0d21a110c09b762ed5f1a5f4da022857b0534e489eb85052d15da460cb229d2a  build/source/extracted-assets-001.zip' | sha256sum -c -
      - name: Extract exact TPI TPD and WDB resources
        run: |
          set -euo pipefail
          unzip -p build/source/extracted-assets-001.zip 'ConquerOnline/install_time_1001.apk' > extracted/install_time_1001.apk
          unzip -p build/source/extracted-assets-001.zip 'ConquerOnline/ConquerOnline-1.1.2.3.apk' > extracted/ConquerOnline-1.1.2.3.apk
          unzip -p extracted/install_time_1001.apk 'assets/ConquerRes/c31.tpi' > extracted/c31.tpi
          unzip -p extracted/install_time_1001.apk 'assets/ConquerRes/c31.tpd' > extracted/c31.tpd
          unzip -p extracted/install_time_1001.apk 'assets/ConquerRes/data1.tpi' > extracted/data1.tpi
          unzip -p extracted/install_time_1001.apk 'assets/ConquerRes/data1.tpd' > extracted/data1.tpd
          unzip -p extracted/ConquerOnline-1.1.2.3.apk 'assets/ConquerRes/data.tpi' > extracted/data.tpi
          unzip -p extracted/ConquerOnline-1.1.2.3.apk 'assets/ConquerRes/data.tpd' > extracted/data.tpd
          unzip -p extracted/ConquerOnline-1.1.2.3.apk 'assets/ConquerRes/ini/c3.wdb' > extracted/c3.wdb
          find extracted -maxdepth 1 -type f ! -name '*.apk' -printf '%f %s bytes\n' | sort | tee reports/package-sizes.txt
          sha256sum extracted/*.tpi extracted/*.tpd extracted/c3.wdb | tee reports/package-sha256.txt
      - name: Upload original package files for direct forensic parsing
        uses: actions/upload-artifact@v4
        with:
          name: Conquer-Original-Mobile-Resource-Packages
          path: |
            extracted/c31.tpi
            extracted/c31.tpd
            extracted/data1.tpi
            extracted/data1.tpd
            extracted/data.tpi
            extracted/data.tpd
            extracted/c3.wdb
            reports/package-sizes.txt
            reports/package-sha256.txt
          retention-days: 30
