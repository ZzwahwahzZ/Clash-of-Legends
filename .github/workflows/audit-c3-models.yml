name: Audit original C3 models
on:
  push:
    paths:
      - ".github/workflows/audit-c3-models.yml"
      - "tools/c3_audit/**"
      - "third_party_patches/c3-mesh-extension-tags.patch"
      - "tools/external_assets/audit_c3_equipment_families.py"
      - "tools/external_assets/render_c3_equipment_previews.py"
      - "tools/external_assets/assemble_c3_equipment_contact_sheets.py"
      - "tools/c3_audit/prepare_c3_validation_subset.py"
      - "scripts/animation/C3VatPlayer.gd"
      - "shaders/C3Vat.gdshader"
      - "shaders/C3VatAlpha.gdshader"
      - "shaders/C3VatUnlit.gdshader"
      - "shaders/C3VatAlphaUnlit.gdshader"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-c3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download v4 original model pack and source index
        run: |
          mkdir -p build reports
          base="https://github.com/ZzwahwahzZ/Clash-of-Legends/releases/download/resource-packs-v4"
          curl --fail --location --retry 5 --retry-all-errors "$base/models.pck" -o build/models.pck
          curl --fail --location --retry 5 --retry-all-errors "$base/resource-source-index.csv" -o resource-source-index.csv
      - name: Configure Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Prepare C3 path list from source index
        run: python3 tools/c3_audit/prepare_c3_paths.py
      - name: Extract C3 and PVR resources from verified PCKs
        run: godot --headless --path . --script tools/c3_audit/extract_c3_for_audit.gd
      - name: Unpack C3 and PVR extraction bundles
        run: python3 tools/c3_audit/unpack_c3_bundle.py
      - name: Install Pillow for texture conversion
        run: python3 -m pip install --disable-pip-version-check numpy pillow texture2ddecoder==1.0.6
      - name: Audit PVR texture headers
        run: python3 tools/c3_audit/audit_pvr_headers.py
      - name: Decode original PVR textures to PNG
        run: python3 tools/c3_audit/decode_pvr_textures.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch pinned Apache-2.0 C3 parser
        run: |
          git clone --filter=blob:none https://github.com/deklol/Preservation-CO-Client.git build/preservation
          git -C build/preservation checkout 090541d10d8a7d001fe804dd1c23325c344f861d
          git -C build/preservation apply "$GITHUB_WORKSPACE/third_party_patches/c3-mesh-extension-tags.patch"
          git -C build/preservation diff --check
      - name: Test C3 parser and per-mesh GLB animation exporter
        run: cargo test --manifest-path tools/c3_audit/Cargo.toml --release
      - name: Audit all original C3 models
        run: cargo run --manifest-path tools/c3_audit/Cargo.toml --release --bin clash-c3-audit -- build/c3-source build/pvr-png build/c3-glb reports/c3-model-audit.json
      - name: Preserve failed C3 samples for binary format investigation
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          report = json.loads(Path("reports/c3-model-audit.json").read_text())
          source_root = Path("build/c3-source").resolve()
          output_root = Path("build/c3-failed-samples")
          output_root.mkdir(parents=True, exist_ok=True)
          manifest = []
          for row in report.get("failed", []):
              rel = Path(row["path"])
              source = (source_root / rel).resolve()
              if source_root not in source.parents or not source.is_file():
                  continue
              target = output_root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              data = target.read_bytes()
              manifest.append({
                  "source": rel.as_posix(),
                  "sample": target.relative_to(output_root).as_posix(),
                  "size_bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "parser_error": row.get("error", "")
              })
          Path("reports/c3-failed-sample-manifest.json").write_text(
              json.dumps({"count": len(manifest), "samples": manifest}, indent=2)
          )
          print("PRESERVED_FAILED_C3_SAMPLES", len(manifest))
          PY
      - name: Build per-family helmet, weapon and equipment candidate inventory
        run: |
          python3 tools/external_assets/audit_c3_equipment_families.py reports/c3-model-audit.json --project-root . --output reports/equipment/c3-equipment-family-audit.json
      - name: Install Blender 4.3.2 for diagnostic equipment renders
        uses: bradyajohnston/setup-blender@v5
        with:
          version: 4.3.2
      - name: Install minimal EGL and OpenGL runtime libraries
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y libegl1 libgl1 libgles2
      - name: Verify Blender and bundled NumPy
        run: blender --background --factory-startup --python-expr "import bpy, numpy; print('BLENDER_OK', bpy.app.version_string, 'NUMPY_OK', numpy.__version__)"
      - name: Render all helmet, weapon and equipment C3 candidates
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          blender --background --factory-startup --python tools/external_assets/render_c3_equipment_previews.py -- --input-root build/c3-glb/equipment/c3 --output-root reports/equipment/previews/models --report reports/equipment/previews/equipment-preview-audit.json
          python3 tools/external_assets/assemble_c3_equipment_contact_sheets.py reports/equipment/previews/equipment-preview-audit.json
      - name: Prepare focused Godot import subset
        run: python3 tools/c3_audit/prepare_c3_validation_subset.py
      - name: Import and validate converted C3 equipment GLB candidates and animation POCs
        run: |
          godot --headless --editor --path . --import --quit
          godot --headless --path . --script tools/c3_audit/validate_c3_glb.gd
      - name: Render imported C3 skeletal and all six full-character VAT clips with Godot
        run: |
          mkdir -p reports
          ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --path . --rendering-method gl_compatibility --script tools/c3_audit/render_c3_skeleton_poc.gd
          ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --path . --rendering-method gl_compatibility --script tools/c3_audit/render_c3_vat_six_clips.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C3-Model-Conversion-Reports
          path: |
            reports/c3-model-audit.json
            reports/c3-failed-sample-manifest.json
            build/c3-failed-samples/**/*.c3
            reports/equipment/c3-equipment-family-audit.json
            reports/equipment/c3-validation-subset.json
            reports/equipment/previews/**
            build/c3-glb/equipment/**/*.glb
            reports/c3-motion-poc-validation.json
            reports/c3-skeletal-poc-frame-a.png
            reports/c3-skeletal-poc-frame-b.png
            reports/pvr-texture-audit.json
            reports/pvr-decode-report.json
            reports/c3-conversion-report.json
            tools/c3_audit/THIRD_PARTY_NOTICES.md
            build/c3-glb/motion-poc/*.glb
            build/c3-glb/motion-poc-skinned/*.glb
            build/c3-glb/skeleton-poc/**/*.glb
            build/c3-glb/motion-poc-vat/*.json
            build/c3-glb/motion-poc-vat/*.rgba32f
            build/c3-glb/motion-poc-vat/*.normalrgba8
            reports/c3-vat-poc-frame-a.png
            reports/c3-vat-poc-frame-b.png
            reports/c3-vat-six-clips/*.png
          if-no-files-found: warn
          retention-days: 14
