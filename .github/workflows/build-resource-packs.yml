name: Build Godot resource PCK packs
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/resource_packs/**"
      - ".github/workflows/build-resource-packs.yml"
permissions:
  contents: write
jobs:
  build-resource-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download verified source release bundles
        run: |
          mkdir -p build/source_archives
          base="https://github.com/ZzwahwahzZ/Conquer-Mobile-Assets./releases/download/mobile-extracted-assets"
          for f in extracted-assets-001.zip conquer-mobile-prepared-assets.zip conquer-mobile-supplemental-assets.zip; do
            curl --fail --location --retry 5 --retry-all-errors "$base/$f" -o "build/source_archives/$f"
          done
          echo "Downloaded source archives:"
          sha256sum build/source_archives/*
      - name: Install 7z archive extractor
        run: python3 -m pip install --break-system-packages py7zr
      - name: Prepare deduplicated category staging tree
        run: python3 tools/resource_packs/prepare_assets.py
      - name: Extract NetDragon TPI/TPD resources
        run: python3 tools/resource_packs/extract_netdragon.py
      - name: Configure Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Build category PCK files
        run: |
          set -euo pipefail
          mkdir -p build/pcks
          godot --headless --editor --path . --quit
          for category in world maps characters monsters equipment mounts effects animations interface audio models; do
            if [ ! -d "resource_stage/$category" ]; then echo "No files for $category; it will be omitted rather than publishing an empty PCK."; continue; fi
            cat > "export_presets.cfg" <<EOF
          [preset.0]
          name="Linux"
          platform="Linux"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="resources"
          include_filter="resource_stage/$category/**/*"
          exclude_filter=""
          export_path="build/pcks/$category.pck"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          export_files=PackedStringArray()
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          debug/export_console_wrapper=1
          binary_format/embed_pck=false
          texture_format/s3tc_bptc=true
          texture_format/etc2_astc=false
          EOF
            godot --headless --path . --export-pack "Linux" "build/pcks/$category.pck"
            if [ ! -s "build/pcks/$category.pck" ]; then
              echo "Missing or empty PCK for $category"; exit 1
            fi
          done
      - name: Validate PCK runtime loading and model catalog
        run: godot --headless --path . --script tools/resource_packs/validate_pcks.gd
      - name: Generate manifest with actual sizes and SHA-256
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("build/pcks")
          packages=[]
          labels={
              "world":("العالم والأصول العامة","World and Core Data"),
              "maps":("الخرائط والمناطق","Maps and Regions"),
              "characters":("الشخصيات والفئات","Characters and Classes"),
              "monsters":("الوحوش والأعداء","Monsters and Enemies"),
              "equipment":("الأسلحة والمعدات","Weapons and Equipment"),
              "mounts":("المطايا والمرافقون","Mounts and Companions"),
              "effects":("المهارات والمؤثرات","Skills and Effects"),
              "animations":("الحركات والأنيميشن","Animations"),
              "interface":("موارد الواجهة","Interface Resources"),
              "audio":("الأصوات والموسيقى","Audio and Music"),
              "models":("نماذج C3 الأصلية","Original C3 Models")
          }
          for p in sorted(root.glob("*.pck")):
              data=p.read_bytes()
              if len(data)<64: raise SystemExit(f"PCK suspiciously small: {p}")
              ar,en=labels[p.stem]
              packages.append({"package_id":p.stem,"file_name":p.name,"display_name_ar":ar,"display_name_en":en,"size_bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"download_url":f"https://github.com/ZzwahwahzZ/Clash-of-Legends/releases/download/resource-packs-v3/{p.name}","godot_version":"4.3","platform":"all"})
          if not packages: raise SystemExit("No PCKs generated.")
          manifest={"manifest_version":"2.2.0","release_tag":"resource-packs-v3","app_version":"1.0.2","package_id":"com.zwahwahzz.clashoflegends","status":"PUBLISHED","resource_packages":packages,"source_release":"https://github.com/ZzwahwahzZ/Conquer-Mobile-Assets./releases/tag/mobile-extracted-assets","build_note":"Generated by Godot 4.3 export-pack from deduplicated source archives; hashes and sizes computed from final PCK bytes."}
          Path("RESOURCE_MANIFEST").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Upload PCKs and source index as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClashOfLegends-Godot43-Resource-PCKs
          path: |
            build/pcks/*.pck
            reports/resource-source-index.csv
            reports/source-archive-extension-audit.json
            RESOURCE_MANIFEST
          if-no-files-found: error
          retention-days: 30
      - name: Upload compact source audit reports
        uses: actions/upload-artifact@v4
        with:
          name: ClashOfLegends-Source-Audit-Reports
          path: |
            reports/resource-source-index.csv
            reports/source-archive-extension-audit.json
            reports/source-format-samples.txt
            reports/tpi-extraction-audit.json
            reports/tpi-indexes.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish resource pack release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: resource-packs-v3
          name: Clash of Legends Resource Packs v3
          body: "Godot 4.3 category PCK packages generated from the verified source asset release. See RESOURCE_MANIFEST for exact byte sizes and SHA-256 hashes."
          files: |
            build/pcks/*.pck
            RESOURCE_MANIFEST
            reports/resource-source-index.csv
            reports/source-archive-extension-audit.json
            reports/source-format-samples.txt
            reports/tpi-extraction-audit.json
            reports/tpi-indexes.zip
          fail_on_unmatched_files: true
