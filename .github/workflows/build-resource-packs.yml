name: Build Godot resource PCK packs
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/resource_packs/**"
      - ".github/workflows/build-resource-packs.yml"
permissions:
  contents: write
jobs:
  build-resource-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download verified source release bundles
        run: |
          mkdir -p build/source_archives
          base="https://github.com/ZzwahwahzZ/Conquer-Mobile-Assets./releases/download/mobile-extracted-assets"
          for f in extracted-assets-001.zip conquer-mobile-prepared-assets.zip conquer-mobile-supplemental-assets.zip; do
            curl --fail --location --retry 5 --retry-all-errors "$base/$f" -o "build/source_archives/$f"
          done
          echo "Downloaded source archives:"
          sha256sum build/source_archives/*
      - name: Prepare deduplicated category staging tree
        run: python3 tools/resource_packs/prepare_assets.py
      - name: Configure Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Build category PCK files
        run: |
          set -euo pipefail
          mkdir -p build/pcks
          for category in world maps characters monsters equipment mounts effects audio; do
            mkdir -p "resource_stage/$category"
            cat > "export_presets.cfg" <<EOF
          [preset.0]
          name="Linux"
          platform="Linux"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter="resource_stage/$category/**/*"
          exclude_filter=""
          export_path="build/pcks/$category.pck"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          EOF
            godot --headless --editor --path . --quit
            godot --headless --path . --export-pack "Linux" "build/pcks/$category.pck"
            if [ ! -s "build/pcks/$category.pck" ]; then
              echo "Missing or empty PCK for $category"; exit 1
            fi
          done
      - name: Generate manifest with actual sizes and SHA-256
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("build/pcks")
          packages=[]
          labels={"world":"العالم والأصول العامة","maps":"الخرائط والمناطق","characters":"الشخصيات والفئات","monsters":"الوحوش والأعداء","equipment":"الأسلحة والمعدات","mounts":"المطايا والمرافقون","effects":"المهارات والمؤثرات","audio":"الأصوات والموسيقى"}
          for p in sorted(root.glob("*.pck")):
              data=p.read_bytes()
              if len(data)<64: raise SystemExit(f"PCK suspiciously small: {p}")
              packages.append({"package_id":p.stem,"file_name":p.name,"display_name_ar":labels[p.stem],"size_bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"download_url":f"https://github.com/ZzwahwahzZ/Clash-of-Legends/releases/download/resource-packs-v1/{p.name}","godot_version":"4.3","platform":"all"})
          if not packages: raise SystemExit("No PCKs generated.")
          manifest={"manifest_version":"2.0.0","app_version":"1.0.2","package_id":"com.zwahwahzz.clashoflegends","status":"PUBLISHED","resource_packages":packages,"source_release":"https://github.com/ZzwahwahzZ/Conquer-Mobile-Assets./releases/tag/mobile-extracted-assets","build_note":"Generated by Godot 4.3 export-pack from deduplicated source archives; hashes and sizes computed from final PCK bytes."}
          Path("RESOURCE_MANIFEST").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Commit generated resource manifest to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Publish verified generated resource pack manifest"
          file_pattern: RESOURCE_MANIFEST
      - name: Upload PCKs and source index as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClashOfLegends-Godot43-Resource-PCKs
          path: |
            build/pcks/*.pck
            build/resource-source-index.csv
            RESOURCE_MANIFEST
          if-no-files-found: error
          retention-days: 30
      - name: Publish resource pack release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: resource-packs-v1
          name: Clash of Legends Resource Packs v1
          body: "Godot 4.3 category PCK packages generated from the verified source asset release. See RESOURCE_MANIFEST for exact byte sizes and SHA-256 hashes."
          files: |
            build/pcks/*.pck
            RESOURCE_MANIFEST
            build/resource-source-index.csv
          fail_on_unmatched_files: true
