name: Build Godot resource PCK packs
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/resource_packs/**"
      - "tools/c3_audit/**"
      - "tools/quality/audit_resource_pack_contents.gd"
      - ".github/workflows/build-resource-packs.yml"
permissions:
  contents: write
concurrency:
  group: resource-packs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-resource-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Enforce reference acceptance ledger
        run: python3 tools/quality/validate_acceptance_ledger.py
      - name: Download verified resource-packs-v4 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/resource_packs/download_resource_pcks.py
      - name: Install 7z archive extractor
        run: python3 -m pip install --break-system-packages py7zr
      - name: Prepare checksum-verified PCK extraction paths
        run: python3 tools/resource_packs/prepare_pck_paths.py
      - name: Configure Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Rehydrate and verify all source assets from resource PCKs
        run: |
          rm -rf resource_stage
          godot --headless --path . --script tools/resource_packs/extract_resource_packs.gd
      - name: Test safe nested audio extraction and provenance
        run: python3 -m unittest tools/resource_packs/test_nested_audio_7z.py
      - name: Extract and index audio embedded in nested 7z archives
        run: python3 tools/resource_packs/extract_nested_audio_7z.py
      - name: Test MESH and Mobile MESZ parser
        run: python3 -m unittest tools.resource_packs.test_c3_wdb_mesh
      - name: Audit C3 WDB motion, object, texture and equipment tables
        run: python3 tools/resource_packs/audit_c3_wdb.py
      - name: Upload immediate C3 WDB equipment mapping diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C3-WDB-MESH-Diagnostics
          path: |
            reports/c3-wdb-audit.json
            reports/c3-motion-source-path-audit.json
            resource_stage/world/resource_mappings/motion_catalog.json
          if-no-files-found: error
          retention-days: 30
      - name: Extract NetDragon TPI/TPD resources
        run: python3 tools/resource_packs/extract_netdragon.py
      - name: Validate all MESH C3 and texture references against extracted TPI assets
        run: python3 tools/resource_packs/validate_c3_equipment_resource_links.py
      - name: Join itemtype, mounttype, equipment MESH and original source assets
        run: python3 tools/resource_packs/build_equipment_item_join_catalog.py
      - name: Upload immediate joined equipment source catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Equipment-Item-Mount-MESH-Join-Audit
          path: |
            reports/equipment-item-join-audit.json
            reports/c3-equipment-resource-link-audit.json
            reports/c3-equipment-source-path-coverage.json
            resource_stage/world/resource_mappings/mesh_equipment_catalog.json
            resource_stage/world/resource_mappings/equipment_item_join_catalog.json
            resource_stage/world/resource_mappings/motion_catalog.json
          if-no-files-found: warn
          retention-days: 30
      - name: Probe original item, drop, quest and refinement data formats
        run: python3 tools/resource_packs/probe_gameplay_data.py
      - name: Build provenance-safe readable gameplay reference catalogs
        run: python3 tools/resource_packs/build_gameplay_reference_catalog.py
      - name: Build provenance-preserving runtime resource catalog
        run: python3 tools/resource_packs/build_runtime_resource_catalog.py
      - name: Prepare source model path lists
        run: |
          cp reports/resource-source-index.csv resource-source-index.csv
          python3 tools/c3_audit/prepare_c3_paths.py
      - name: Extract C3 and PVR sources for conversion
        run: |
          godot --headless --path . --script tools/c3_audit/extract_c3_for_audit.gd
          python3 tools/c3_audit/unpack_c3_bundle.py
      - name: Decode original PVR textures
        run: |
          python3 -m pip install --disable-pip-version-check numpy pillow texture2ddecoder==1.0.6
          python3 -m unittest tools.c3_audit.test_pvr_decoder
          python3 tools/c3_audit/audit_pvr_headers.py
          python3 tools/c3_audit/decode_pvr_textures.py
      - name: Validate and decode original MJP textures
        run: |
          python3 -m unittest tools/resource_packs/test_mjp_decoder.py
          python3 tools/resource_packs/decode_mjp_assets.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch pinned Apache-2.0 C3 parser
        run: |
          git clone --filter=blob:none https://github.com/deklol/Preservation-CO-Client.git build/preservation
          git -C build/preservation checkout 090541d10d8a7d001fe804dd1c23325c344f861d
      - name: Test C3 parser and per-mesh GLB animation exporter
        run: cargo test --manifest-path tools/c3_audit/Cargo.toml --release
      - name: Convert original C3 models and validate Godot imports
        run: |
          cargo run --manifest-path tools/c3_audit/Cargo.toml --release --bin clash-c3-audit -- build/c3-source build/pvr-png build/c3-glb reports/c3-model-audit.json
          godot --headless --editor --path . --import --quit
          godot --headless --path . --script tools/c3_audit/validate_c3_glb.gd
          python3 tools/c3_audit/merge_c3_glb_assets.py
      - name: Audit original DMap terrain and map catalog
        run: cargo run --manifest-path tools/c3_audit/Cargo.toml --release --bin audit_maps -- resource_stage reports/map-audit.json
      - name: Build category PCK files
        run: |
          set -euo pipefail
          mkdir -p build/pcks
          godot --headless --editor --path . --import --quit
          for category in world maps characters monsters equipment mounts effects animations interface audio models; do
            if [ ! -d "resource_stage/$category" ]; then echo "No files for $category; it will be omitted rather than publishing an empty PCK."; continue; fi
            cat > "export_presets.cfg" <<EOF
          [preset.0]
          name="Linux"
          platform="Linux"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="resources"
          include_filter="resource_stage/$category/**/*"
          exclude_filter=""
          export_path="build/pcks/$category.pck"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          export_files=PackedStringArray()
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          debug/export_console_wrapper=1
          binary_format/embed_pck=false
          texture_format/s3tc_bptc=true
          texture_format/etc2_astc=false
          EOF
            godot --headless --path . --export-pack "Linux" "build/pcks/$category.pck"
            if [ ! -s "build/pcks/$category.pck" ]; then
              echo "Missing or empty PCK for $category"; exit 1
            fi
          done
      - name: Audit generated runtime PCK content and verified character coverage
        env:
          RESOURCE_PACK_DIR: res://build/pcks
        run: |
          set -o pipefail
          ALSOFT_DRIVERS=null xvfb-run -a godot --path . --rendering-method gl_compatibility --script tools/quality/audit_resource_pack_contents.gd 2>&1 | tee reports/resource-pack-runtime-audit.log
          test -s resource-pack-audit.json
      - name: Upload runtime PCK audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClashOfLegends-Runtime-PCK-Audit
          path: |
            resource-pack-audit.json
            reports/resource-pack-runtime-audit.log
          if-no-files-found: warn
          retention-days: 30
      - name: Validate PCK runtime loading and model catalog
        run: ALSOFT_DRIVERS=null xvfb-run -a godot --path . --rendering-method gl_compatibility --script tools/resource_packs/validate_pcks.gd
      - name: Validate gameplay collision shapes
        run: godot --headless --path . --script tools/resource_packs/validate_physics_shapes.gd
      - name: Generate manifest with actual sizes and SHA-256
        env:
          ALLOW_C3_ASSET_REDISTRIBUTION: ${{ vars.ALLOW_C3_ASSET_REDISTRIBUTION }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("build/pcks")
          packages=[]
          labels={
              "world":("العالم والأصول العامة","World and Core Data"),
              "maps":("الخرائط والمناطق","Maps and Regions"),
              "characters":("الشخصيات والفئات","Characters and Classes"),
              "monsters":("الوحوش والأعداء","Monsters and Enemies"),
              "equipment":("الأسلحة والمعدات","Weapons and Equipment"),
              "mounts":("المطايا والمرافقون","Mounts and Companions"),
              "effects":("المهارات والمؤثرات","Skills and Effects"),
              "animations":("الحركات والأنيميشن","Animations"),
              "interface":("موارد الواجهة","Interface Resources"),
              "audio":("الأصوات والموسيقى","Audio and Music"),
              "models":("نماذج C3 الأصلية","Original C3 Models")
          }
          for p in sorted(root.glob("*.pck")):
              data=p.read_bytes()
              if len(data)<64: raise SystemExit(f"PCK suspiciously small: {p}")
              ar,en=labels[p.stem]
              packages.append({"package_id":p.stem,"file_name":p.name,"display_name_ar":ar,"display_name_en":en,"size_bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"download_url":(f"https://github.com/ZzwahwahzZ/Clash-of-Legends/releases/download/resource-packs-v4/{p.name}" if os.environ.get("ALLOW_C3_ASSET_REDISTRIBUTION","").lower()=="true" else ""),"godot_version":"4.3","platform":"all"})
          if not packages: raise SystemExit("No PCKs generated.")
          distribution_allowed=os.environ.get("ALLOW_C3_ASSET_REDISTRIBUTION","").lower()=="true"
          manifest={"manifest_version":"2.2.0","release_tag":"resource-packs-v4","app_version":"1.0.3","package_id":"com.zwahwahzz.clashoflegends","status":("PUBLISHED" if distribution_allowed else "BUILT_NOT_PUBLISHED_REVIEW_REQUIRED"),"distribution_allowed":distribution_allowed,"resource_packages":packages,"source_release":"https://github.com/ZzwahwahzZ/Conquer-Mobile-Assets./releases/tag/mobile-extracted-assets","build_note":"Generated by Godot 4.3 export-pack from deduplicated source archives; hashes and sizes computed from final PCK bytes."}
          Path("RESOURCE_MANIFEST").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Build and validate project-owned public resource pack
        run: |
          set -euo pipefail
          test -s assets/shaders/weapon_glow.gdshader
          mkdir -p build/public-pcks
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Linux"
          platform="Linux"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="resources"
          include_filter="assets/shaders/weapon_glow.gdshader"
          exclude_filter=""
          export_path="build/public-pcks/owned-core.pck"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          export_files=PackedStringArray()
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          debug/export_console_wrapper=1
          binary_format/embed_pck=false
          texture_format/s3tc_bptc=true
          texture_format/etc2_astc=false
          EOF
          godot --headless --path . --export-pack "Linux" "build/public-pcks/owned-core.pck"
          test -s build/public-pcks/owned-core.pck
          godot --headless --path . --script tools/resource_packs/validate_owned_distribution.gd
      - name: Create public manifest from allowlisted project-owned assets only
        run: |
          set -euo pipefail
          cp RESOURCE_MANIFEST RESOURCE_MANIFEST_INTERNAL
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("build/public-pcks/owned-core.pck")
          data=p.read_bytes()
          if len(data)<64: raise SystemExit("Owned resource PCK is unexpectedly small.")
          manifest={
            "manifest_version":"1.0.0",
            "release_tag":"owned-resource-packs-v1",
            "app_version":"1.0.3",
            "package_id":"com.zwahwahzz.clashoflegends",
            "status":"PUBLISHED",
            "distribution_allowed":True,
            "distribution_policy":"Only the explicit project-owned allowlist is published. Extracted Conquer source assets and converted derivatives are excluded.",
            "resource_packages":[{
              "package_id":"owned-core",
              "file_name":"owned-core.pck",
              "display_name_ar":"موارد اللعبة الأصلية",
              "display_name_en":"Project-owned Core Resources",
              "size_bytes":len(data),
              "sha256":hashlib.sha256(data).hexdigest(),
              "download_url":"https://github.com/ZzwahwahzZ/Clash-of-Legends/releases/download/owned-resource-packs-v1/owned-core.pck",
              "godot_version":"4.3",
              "platform":"all"
            }],
            "allowlist_file":"distribution/OWNED_ASSETS_ALLOWLIST.json",
            "build_note":"Only assets explicitly listed in the project-owned allowlist are included."
          }
          Path("RESOURCE_MANIFEST").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Commit generated resource manifest
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          manifest_backup="${RUNNER_TEMP}/RESOURCE_MANIFEST.generated"
          cp RESOURCE_MANIFEST "$manifest_backup"
          # Rebase conflicts on a generated manifest are avoided by starting from
          # the latest remote branch and then applying this run's freshly verified
          # manifest. Source-code changes from the remote are preserved.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            cp "$manifest_backup" RESOURCE_MANIFEST
            git add RESOURCE_MANIFEST
            if git diff --cached --quiet; then
              echo "RESOURCE_MANIFEST already matches the latest remote branch."
              exit 0
            fi
            git commit -m "Update resource manifest from verified PCK build"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push raced with another update; retrying from the latest remote branch (attempt $attempt)."
          done
          echo "Unable to push manifest after 3 synchronized attempts."
          exit 1
      - name: Upload compact source audit reports
        uses: actions/upload-artifact@v4
        with:
          name: ClashOfLegends-Source-Audit-Reports
          path: |
            reports/resource-source-index.csv
            reports/source-archive-extension-audit.json
            reports/source-format-samples.txt
            reports/c3-model-audit.json
            reports/c3-motion-poc-validation.json
            reports/c3-wdb-audit.json
            reports/c3-equipment-resource-link-audit.json
            reports/c3-equipment-source-path-coverage.json
            reports/equipment-item-join-audit.json
            resource_stage/world/resource_mappings/mesh_equipment_catalog.json
            resource_stage/world/resource_mappings/equipment_item_join_catalog.json
            reports/c3-conversion-report.json
            reports/c3-runtime-integration.json
            reports/pvr-texture-audit.json
            reports/pvr-decode-report.json
            reports/mjp-decode-report.json
            resource_stage/world/resource_mappings/mjp_texture_map.json
            reports/map-audit.json
            reports/tpi-extraction-audit.json
            reports/gameplay-data-source-probe.json
            reports/gameplay-readable-catalog-report.json
            resource_stage/world/gameplay_reference/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish allowlisted project-owned resource release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owned-resource-packs-v1
          name: Clash of Legends — Project-owned Resources v1
          body: "Only resources listed in distribution/OWNED_ASSETS_ALLOWLIST.json are included. No extracted Conquer source assets or converted derivatives are distributed in this release."
          files: |
            build/public-pcks/owned-core.pck
            RESOURCE_MANIFEST
          overwrite_files: true
          fail_on_unmatched_files: true
